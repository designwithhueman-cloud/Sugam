<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus changes the page</title>
<style>:focus-visible { outline: 3px solid #5b2fd0; outline-offset: 2px; }</style></head>
<body>
<main>
  <h1>Focus changes the page</h1>
  <p><a href="/other" onfocus="location.href='/other'">Go somewhere</a></p>
</main>
</body>
</html>
