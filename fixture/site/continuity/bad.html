<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ledgerly: invoices paid on time</title>
<style>body{font:16px/1.5 system-ui;margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #ddd}
.hamburger{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}nav ul{display:none;list-style:none;margin:0;padding:8px 16px}nav.open ul{display:block}
main{padding:16px}a.cta{display:inline-block;background:#1d4ed8;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none}label{display:block;margin-top:12px}input{font-size:16px;padding:8px;width:100%;box-sizing:border-box}</style></head>
<body><header><strong>Ledgerly</strong><nav id="nav"><div class="hamburger"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="#111" stroke-width="2"/></svg></div>
<ul><li><a href="features.html">Features</a></li><li><a href="pricing.html">Pricing</a></li><li><a href="login.html">Log in</a></li></ul></nav></header>
<main><h1>Get invoices paid on time</h1><p>Ledgerly sends reminders for every unpaid invoice so small teams get paid without chasing.</p>
<p><a class="cta" id="demo" href="next.html">Book a demo</a></p>
<h2>Pay for your plan</h2>
<form action="/pay" method="post"><label>Name on card <input name="ccname" autocomplete="cc-name"></label><label>Card number <input name="cardnumber" autocomplete="cc-number" inputmode="numeric"></label>
<label>Expiry <input name="exp" autocomplete="cc-exp"></label><button type="submit">Pay now</button></form></main>
<script>
document.querySelector('.hamburger').addEventListener('click', () => document.getElementById('nav').classList.toggle('open'));
document.getElementById('demo').addEventListener('click', (e) => { e.preventDefault(); location.replace('next.html'); });
let slow = 0; document.addEventListener('keydown', () => { if (slow++ < 3) { const t = performance.now(); while (performance.now() - t < 320) {} } });
</script></body></html>
