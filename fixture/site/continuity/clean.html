<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ledgerly: invoices paid on time</title>
<style>body{font:16px/1.5 system-ui;margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #ddd}
.menu-button{width:44px;height:44px;border:1px solid #999;background:#fff;border-radius:8px}#menu{list-style:none;margin:0;padding:8px 16px}#menu[hidden]{display:none}
main{padding:16px}a.cta{display:inline-block;background:#1d4ed8;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none}label{display:block;margin-top:12px}input{font-size:16px;padding:8px;width:100%;box-sizing:border-box}</style></head>
<body><header><strong>Ledgerly</strong><nav aria-label="Main"><button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">☰</button>
<ul id="menu" hidden><li><a href="features.html">Features</a></li><li><a href="pricing.html">Pricing</a></li><li><a href="login.html">Log in</a></li></ul></nav></header>
<main><h1>Get invoices paid on time</h1><p>Ledgerly sends reminders for every unpaid invoice so small teams get paid without chasing.</p>
<p><a class="cta" href="next.html">Book a demo</a></p>
<h2>Pay for your plan</h2>
<form action="/checkout/review" method="post"><p>You will review your order on the next step before we charge your card.</p><label>Name on card <input name="ccname" autocomplete="cc-name"></label><label>Card number <input name="cardnumber" autocomplete="cc-number" inputmode="numeric"></label>
<label>Expiry <input name="exp" autocomplete="cc-exp"></label><button type="submit">Continue to review</button></form></main>
<script>
const b = document.querySelector('.menu-button'), m = document.getElementById('menu');
const set = (open) => { m.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); };
b.addEventListener('click', () => set(m.hidden));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !m.hidden) { set(false); b.focus(); } });
</script></body></html>
