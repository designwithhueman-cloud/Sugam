<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit: invoices in two clicks</title><meta name="description" content="Orbit sends invoices for freelancers."><style>body{font-family:system-ui;margin:0;color:#111}main{max-width:960px;margin:0 auto;padding:20px}p{line-height:1.6}.cta{min-height:48px;padding:0 24px;font-size:18px;font-weight:600;background:#5b2fd0;color:#fff;border:0;border-radius:10px}.icon{width:44px;height:44px;border:1px solid #888;border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid article{border:1px solid #ddd;border-radius:12px;padding:16px}@media (max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section><h1>Invoices in two clicks</h1><p>Orbit helps freelancers send invoices and get paid faster, with reminders that go out for you.</p><form><label for="d">Invoice date</label><br><input id="d" name="d" required pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" aria-invalid="true" aria-errormessage="d-err" aria-describedby="d-err"><p id="d-err" role="alert" style="color:#a32d12">You failed to enter a valid date.</p><button class="cta" type="submit">Send invoice</button></form></section></main></body></html>
